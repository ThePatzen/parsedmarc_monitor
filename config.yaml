name: DMARC Monitor
version: "0.1.0"
slug: parsedmarc_monitor
description: Parse DMARC aggregate reports and expose health metrics to Home Assistant.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
services:
  - mqtt:need
backup: cold
options:
  imap_host: null
  imap_port: 993
  imap_ssl: true
  imap_skip_certificate_verification: false
  imap_username: null
  imap_password: null
  reports_folder: INBOX
  archive_folder: Archive
  check_timeout: 60
  retention_days: 90
  known_sources: []
  log_level: info
schema:
  imap_host: str
  imap_port: port
  imap_ssl: bool
  imap_skip_certificate_verification: bool
  imap_username: str
  imap_password: password
  reports_folder: str
  archive_folder: str
  check_timeout: int(10,3600)
  retention_days: int(1,3650)
  known_sources:
    - name: str
      cidr: str?
      rdns_suffix: str?
  log_level: list(debug|info|warning|error)
