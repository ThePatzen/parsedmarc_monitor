[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
exclude = [
    ".git",
    ".idea",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
    ".coverage",
    "*:Zone.Identifier",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "I001"]

[tool.pytest.ini_options]
pythonpath = ["rootfs/app"]
