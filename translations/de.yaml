configuration:
  imap_host:
    name: IMAP-Host
    description: Hostname oder IP-Adresse des dedizierten Postfachservers, der DMARC-Reports empfängt.
  imap_port:
    name: IMAP-Port
    description: Port des IMAP-Servers. Für IMAPS wird Port 993 empfohlen.
  imap_ssl:
    name: IMAP SSL/TLS verwenden
    description: Eine verschlüsselte IMAPS-Verbindung verwenden. Nur deaktivieren, wenn der Server dies ausdrücklich erfordert.
  imap_skip_certificate_verification:
    name: Zertifikatsprüfung überspringen
    description: Deaktiviert die Prüfung des IMAP-Serverzertifikats und reduziert damit die Sicherheit. Nicht empfohlen.
  imap_username:
    name: IMAP-Benutzername
    description: Benutzername des dedizierten DMARC-Report-Postfachs.
  imap_password:
    name: IMAP-Passwort
    description: Passwort des dedizierten DMARC-Report-Postfachs.
  reports_folder:
    name: Report-Ordner
    description: IMAP-Ordner, den parsedmarc auf eingehende Reports überwacht.
  archive_folder:
    name: Archiv-Ordner
    description: IMAP-Ordner, in den Quellmails erst nach erfolgreicher SQLite-Speicherung verschoben werden.
  check_timeout:
    name: IMAP-Timeout
    description: Maximaler Timeout für IMAP-Operationen bzw. Prüfintervalle in Sekunden.
  retention_days:
    name: SQLite-Aufbewahrung
    description: Anzahl der Tage, für die geparste DMARC-Daten in der lokalen SQLite-Datenbank der App erhalten bleiben.
  known_sources:
    name: Bekannte legitime Absender-Infrastruktur
    description: Legitime Mailserver anhand CIDR und/oder Reverse-DNS-Suffix. Damit werden eigene Konfigurationsfehler von gewöhnlichen Spoofing-Versuchen unterschieden.
  log_level:
    name: Log-Level
    description: Ausführlichkeit der Laufzeitprotokolle der DMARC-Monitor-App.
